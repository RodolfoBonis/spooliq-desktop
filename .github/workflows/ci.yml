name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lido pelo `dart pub token add --env-var` em cada `pub get`.
  PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Authenticate private pub
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  build:
    name: Build ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: bash scripts/build_macos_dmg.sh
            artifact: dist/*.dmg
          - os: windows-latest
            cmd: flutter build windows --release -t lib/main_production.dart && iscc /DAppVersion=0.1.0 windows\installer.iss
            artifact: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Authenticate private pub
        shell: bash
        run: dart pub token add https://pub.rodolfodebonis.com.br --env-var PUB_TOKEN
      - run: flutter pub get
      - run: ${{ matrix.cmd }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - uses: actions/upload-artifact@v4
        with:
          name: spooliq-${{ runner.os }}
          path: ${{ matrix.artifact }}
